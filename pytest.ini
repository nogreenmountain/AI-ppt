[pytest]
testpaths = tests/report
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers

# Allows real PowerPoint + Office smoke tests to be run explicitly with:
#     RUN_RENDERER_INTEGRATION=1 pytest
# Without the env var the integration test is skipped, keeping the
# default suite fully offline.
markers =
    integration: marks tests as requiring real PowerPoint/Office
